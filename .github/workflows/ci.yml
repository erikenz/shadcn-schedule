name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package declarations
        run: pnpm --filter shadcn-schedule build

      - name: Run Ultracite & Oxlint check
        run: pnpm check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  fallow:
    name: Codebase Intelligence (Fallow)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Fallow dead code & architecture audit
        run: pnpm fallow dead-code && pnpm fallow architecture

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and apps
        run: pnpm build

  changeset:
    name: Changeset Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for Changesets
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [check, typecheck, test, fallow, build, changeset]
    steps:
      - name: Check Statuses
        run: |
          check="${{ needs.check.result }}"
          typecheck="${{ needs.typecheck.result }}"
          test="${{ needs.test.result }}"
          fallow="${{ needs.fallow.result }}"
          build="${{ needs.build.result }}"
          changeset="${{ needs.changeset.result }}"

          echo "check: $check"
          echo "typecheck: $typecheck"
          echo "test: $test"
          echo "fallow: $fallow"
          echo "build: $build"
          echo "changeset: $changeset"

          for result in "$check" "$typecheck" "$test" "$fallow" "$build"; do
            if [ "$result" != "success" ]; then
              echo "Error: Core check failed with status: $result"
              exit 1
            fi
          done

          # Changeset is skipped on pushes to main, but required to succeed on pull requests
          if [ "$changeset" != "success" ] && [ "$changeset" != "skipped" ]; then
            echo "Error: Changeset check failed with status: $changeset"
            exit 1
          fi

          echo "All checks passed successfully."
